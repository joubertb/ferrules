services:
  ferrules:
    build: .
    container_name: ferrules-api
    ports:
      - "3002:3002"
    volumes:
      # Mount configuration directory for runtime updates
      - ./configs:/app/configs:ro
      # Mount analysis reports directory
      - ./reports:/app/reports
    environment:
      - FERRULES_CONFIG_PATH=/app/configs/font_corrections.json
      - FERRULES_ENABLE_CORRECTIONS=true
      - FERRULES_LOG_LEVEL=info
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true

    ports:
      - "4317:4317"
      - "4318:4318"
      - "5775:5775/udp" # For Thrift compact protocol
      - "6831:6831/udp" # For Jaeger agent
      - "6832:6832/udp" # For Thrift binary protocol
      - "5778:5778" # For local agent admin
      - "16686:16686" # Jaeger UI
      - "14268:14268" # For collector
      - "14250:14250" # For gRPC
      - "9411:9411" # Zipkin compatibility
