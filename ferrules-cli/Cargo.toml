[package]
name = "ferrules"
version = "0.1.11"
edition = "2021"
authors = ["Amine dirhoussi <aminedirhoussi1@gmail.com>"]
description = "Modern, fast, document parser written in 🦀"
repository = "https://github.com/aminediro/ferrules"

[features]
# Features defined centrally in workspace root Cargo.toml comments  
default = ["correction-engine", "modtext"]
correction-engine = ["ferrules-core/correction-engine"]
modtext = ["ferrules-core/modtext"]

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
memmap2 = { workspace = true }

# CLI specific
ferrules-core = { path = "../ferrules-core", default-features = false }
clap = { workspace = true }
indicatif = "0.17.9"

# Font debug binary removed as part of correction module consolidation
# [[bin]]
# name = "font-debug"
# path = "../ferrules-core/src/correction/font_debug.rs"
