[package]
name = "ferrules-core"
version = "0.1.11"
edition = "2021"
repository = "https://github.com/aminediro/ferrules"


[dependencies]
tracing-subscriber = "0.3"
lazy_static = "1.5.0"
itertools = "0.14.0"
colored = "3.0.0"
dirs = "6.0.0"
half = "2.4.1"
anyhow = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

bitflags = "2.4"
clap = { version = "4.5.20", features = ["derive"] }

thiserror = { workspace = true }
rkyv = { workspace = true }
bytecheck = "0.6.12"
metrics = { workspace = true, optional = true }

# pdf reader
imageproc = "0.25.0"
ab_glyph = "0.2.29"
pdfium-render = { version = "=0.8.34", default-features = false, features = [
    "static",
    "sync",
    "image",
    "pdfium_6666",
] }
lopdf = "0.34.0"
# Inference
image = "0.25.5"
ndarray = "0.16.1"
ort = { version = "=2.0.0-rc.9", features = ["fetch-models"] }
serde_millis = "0.1.1"
rand = "0.8.5"
# Rendering
build_html = "2.6.0"
regex = "1.11.1"
html2md = "0.2.15"
# Adobe Glyph List support
once_cell = "1.19"
phf = { version = "0.11", features = ["macros"] }
# Dictionary and spellchecking support
spellbook = { version = "0.2", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
# Sentence boundary detection (Unicode Standard Annex #29)
unicode-segmentation = "1.12"

[features]
default = ["correction-engine", "modtext"]
correction-engine = ["spellbook", "moka"]
metrics = ["dep:metrics"]
modtext = []

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.9", features = ["coreml", "fetch-models", "half"] }
objc2 = { version = "^0.6.4" }
objc2-core-foundation = { version = "^0.3.2" }
objc2-foundation = { version = "^0.3.2" }
objc2-vision = { version = "^0.3.2", features = [
    "VNRequest",
    "VNRequestHandler",
    "VNRecognizeTextRequest",
    # Getting results
    "VNObservation",
    "VNTypes",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.9", features = [
    "fetch-models",
    "half",
    "cuda",
    "tensorrt",
    "load-dynamic",
] }

[dev-dependencies]
rand = "0.8.5"
rayon = "1.10.0"
criterion = { version = "0.5", features = ["html_reports"] }


[[bench]]
name = "onnx_batch"
harness = false
